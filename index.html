<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="rating" content="adult" />
  <title>Jynvelo</title>
  <link rel="icon" href="logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="gate" id="gate">
    <div class="gate-box">
      <img src="logo.jpg" alt="Jynvelo" width="72" height="72" style="width:72px;height:72px;border-radius:16px;object-fit:cover" />
      <h1 style="margin:14px 0 6px">Jynvelo</h1>
      <p style="color:#c4b8a8;margin:0 0 18px">Adults only. You must be 18 or older.</p>
      <button class="btn btn-gold" onclick="enter()">I am 18+</button>
      <button class="btn btn-ghost" onclick="location.href='https://www.google.com'">Exit</button>
    </div>
  </div>

  <div id="site" style="display:none">
    <header class="top">
      <div class="wrap top-in">
        <a class="brand" href="index.html">
          <img src="logo.jpg" alt="Jynvelo logo" />
          Jyn<b>velo</b>
        </a>
        <div class="nav-actions">
          <a class="btn btn-ghost" href="upload.html">Upload</a>
          <span id="authBox"></span>
        </div>
        <input class="search" id="q" placeholder="Search title or #hashtag" />
      </div>
    </header>

    <main class="wrap">
      <div id="welcome" class="welcome" style="display:none"></div>
      <section class="hero">
        <p class="k">Jynvelo · 18+</p>
        <h1>Trending on Jynvelo</h1>
        <p class="s">Upload your video with a title and hashtags. Members watch in HD.</p>
        <div class="hero-btns" id="heroBtns"></div>
      </section>
      <div class="cats">
        <button class="cat on" data-c="">All</button>
        <button class="cat" data-c="hindi">#hindi</button>
        <button class="cat" data-c="hd">#hd</button>
        <button class="cat" data-c="new">#new</button>
        <button class="cat" data-c="indian">#indian</button>
      </div>
      <h2 class="sec">Latest videos</h2>
      <div id="grid" class="grid"></div>
    </main>
    <footer class="foot wrap">Jynvelo · 18+</footer>
  </div>

  <div class="player" id="player">
    <div class="player-in">
      <div class="preroll" id="preroll">
        <div>AD · 10s</div>
        <div id="skip">Skip in 10</div>
      </div>
      <video id="vid" controls playsinline></video>
      <div style="padding:12px 14px">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
          <strong id="ptitle"></strong>
          <button class="btn btn-ghost" onclick="closeP()">Close</button>
        </div>
        <p id="ptags" style="color:#d4b06a;font-size:13px;margin:8px 0 0"></p>
      </div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script type="module">
    import "./app.js";
    const gate = document.getElementById("gate");
    const site = document.getElementById("site");
    window.enter = () => { sessionStorage.setItem("jv18", "1"); gate.style.display = "none"; site.style.display = "block"; };
    if (sessionStorage.getItem("jv18") === "1") enter();

    const box = document.getElementById("authBox");
    function paintAuth(u) {
      const hb = document.getElementById("heroBtns");
      if (!u) {
        box.innerHTML = '<a class="btn btn-gold" href="login.html">Log in</a>';
        hb.innerHTML = '<a class="btn btn-gold" href="login.html">Create account</a><a class="btn btn-ghost" href="login.html">Log in</a>';
        return;
      }
      const name = u.displayName || (u.email || "You").split("@")[0];
      box.innerHTML = '<span class="userchip">'+name+'</span><button class="btn btn-ghost" id="lo">Out</button>';
      document.getElementById("lo").onclick = () => JV.logout();
      hb.innerHTML = '<a class="btn btn-gold" href="upload.html">Upload video</a>';
    }
    JV.onUser(paintAuth);
    const w = document.getElementById("welcome");
    const note = sessionStorage.getItem("jv_welcome");
    if (note) {
      w.style.display = "block";
      w.textContent = note;
      sessionStorage.removeItem("jv_welcome");
    }

    const grid = document.getElementById("grid");
    let all = [];
    let cat = "";
    document.querySelectorAll(".cat").forEach((b) => {
      b.onclick = () => {
        cat = b.dataset.c || "";
        document.querySelectorAll(".cat").forEach((x) => x.classList.toggle("on", x === b));
        draw(all);
      };
    });
    async function load() {
      try { all = await JV.listVideos(); } catch (e) { all = []; }
      draw(all);
    }
    function draw(list) {
      const q = (document.getElementById("q").value || "").toLowerCase();
      const rows = list.filter((v) => {
        const hay = ((v.title || "") + " " + JV.formatTags(v.tags || [])).toLowerCase();
        if (cat && !hay.includes(cat)) return false;
        if (!q) return true;
        return hay.includes(q.replace(/^#/, ""));
      });
      if (!rows.length) {
        grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><strong style="color:#fff">Library is empty</strong><br>Tap Upload and add a title + hashtags.</div>';
        return;
      }
      grid.innerHTML = rows.map((v, i) =>
        '<article class="card" data-i="'+i+'"><div class="thumb">▶</div><div class="meta"><h3>'+
        (v.title||"Video")+'</h3><small>'+(v.user||"")+'</small><div style="color:#d4b06a;font-size:12px;margin-top:4px">'+
        JV.formatTags(v.tags||[])+'</div></div></article>'
      ).join("");
      grid.querySelectorAll(".card").forEach((el) => {
        el.onclick = () => openP(rows[+el.dataset.i]);
      });
    }
    document.getElementById("q").oninput = () => draw(all);
    load();

    let t;
    window.openP = (v) => {
      document.getElementById("player").classList.add("show");
      document.getElementById("ptitle").textContent = v.title || "";
      document.getElementById("ptags").textContent = JV.formatTags(v.tags || []);
      const preroll = document.getElementById("preroll");
      const vid = document.getElementById("vid");
      preroll.style.display = "flex";
      vid.style.display = "none";
      vid.src = v.src || "";
      let n = 10;
      document.getElementById("skip").textContent = "Skip in " + n;
      clearInterval(t);
      t = setInterval(() => {
        n -= 1;
        document.getElementById("skip").textContent = n > 0 ? "Skip in " + n : "Skip";
        if (n <= 0) {
          clearInterval(t);
          preroll.style.display = "none";
          vid.style.display = "block";
          vid.play().catch(() => {});
        }
      }, 1000);
    };
    window.closeP = () => {
      clearInterval(t);
      const vid = document.getElementById("vid");
      vid.pause();
      document.getElementById("player").classList.remove("show");
    };
  </script>
</body>
</html>
